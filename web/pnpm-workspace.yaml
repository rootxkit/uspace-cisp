# pnpm settings (pnpm 11 reads them here, not from .npmrc). Not a
# workspace: web/ is one package.
engineStrict: true
saveExact: true
# The peers are listed explicitly in package.json.
autoInstallPeers: false
# No install script runs: sharp (next's optional image optimiser) and
# unrs-resolver are not needed by this app; the kit ships built output.
allowBuilds:
  sharp: false
  unrs-resolver: false
