name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local

defaults:
  run:
    # Explicit bash runs steps with -eo pipefail.
    shell: bash

jobs:
  # Path filters for pull requests. On main and on tags every job runs.
  # A job skipped by its filter reports as skipped, which a required
  # check accepts; gitleaks is never filtered.
  changes:
    name: changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ github.event_name != 'pull_request' || steps.filter.outputs.go == 'true' }}
      generate: ${{ github.event_name != 'pull_request' || steps.filter.outputs.generate == 'true' }}
      integration: ${{ github.event_name != 'pull_request' || steps.filter.outputs.integration == 'true' }}
      web: ${{ github.event_name != 'pull_request' || steps.filter.outputs.web == 'true' }}
      caddy: ${{ github.event_name != 'pull_request' || steps.filter.outputs.caddy == 'true' }}
      release: ${{ github.event_name != 'pull_request' || steps.filter.outputs.release == 'true' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: github.event_name == 'pull_request'
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            # Everything a Go test reads, not only Go: the embedded
            # migrations, the schemas, testdata and fixtures, the Caddy
            # snippet and the PLAN rows its test checks (core-ui-ci
            # audit S1: a skipped job is green to a required check).
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - '.golangci.yml'
              - 'Makefile'
              - 'tools/**'
              - 'api/**'
              - 'migrations/**'
              - 'schemas/**'
              - 'sqlc.yaml'
              - '**/testdata/**'
              - 'test/**'
              - 'deploy/**'
              - 'docs/PLAN.md'
              - '.github/workflows/ci.yml'
            generate:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'api/**'
              - 'tools/**'
              - 'sqlc.yaml'
              - 'migrations/**'
              - 'schemas/**'
              - 'web/src/api/**'
              - 'web/pnpm-lock.yaml'
              - 'Makefile'
              - '.github/workflows/ci.yml'
            integration:
              - '**/*.go'
              - 'migrations/**'
              - 'go.mod'
              - 'go.sum'
              - 'deploy/**'
              - 'test/**'
              - '**/testdata/**'
              - 'schemas/**'
              - 'Makefile'
              - '.github/workflows/ci.yml'
            web:
              - 'web/**'
              - 'api/openapi.yaml'
              - 'deploy/Dockerfile.web'
              - '.github/workflows/ci.yml'
            caddy:
              - 'deploy/**'
              - 'Dockerfile'
              - 'test/e2e/**'
              - 'internal/auth/**'
              - 'internal/httpapi/**'
              - 'cmd/api/**'
              - 'go.mod'
              - 'go.sum'
              - '.github/workflows/ci.yml'
            release:
              - 'deploy/deploy.sh'
              - 'tools/conformance*.sh'
              - 'tools/deploy-selftest.sh'
              - 'Makefile'
              - '.github/workflows/ci.yml'

  build-vet-lint:
    name: build, vet, fmt, lint
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: make fmt-check
      - run: go build ./...
      - name: go vet (with the integration tag)
        run: make vet
      - name: go mod tidy is clean
        run: make tidy
      # Pinned like the Makefile's STATICCHECK_VERSION and
      # GOLANGCI_LINT_VERSION (equal to uspace-core's); change both in one
      # `ci:` commit.
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: v2.14.0

  generate-check:
    name: generated code is current
    needs: changes
    if: needs.changes.outputs.generate == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: web dependencies (frozen lockfile)
        working-directory: web
        run: pnpm install --frozen-lockfile
      # oapi-codegen and sqlc run from the module cache (go.mod tool
      # directives); the TypeScript types through the kit's
      # uspace-ui-gen-api, pinned by web/pnpm-lock.yaml.
      - name: make generate-check
        run: make generate-check

  test-race:
    name: test with the race detector
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: go test -race
        run: go test -race -count=1 -shuffle=on -coverprofile=coverage.out -covermode=atomic ./...
      - name: signing tools end to end (tools/jws-smoke.sh)
        run: make jws-smoke
      - name: coverage summary
        run: |
          {
            echo '### Coverage'
            echo '```'
            go tool cover -func=coverage.out | tail -n 1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          go tool cover -func=coverage.out | tail -n 1

  integration:
    name: integration (PostgreSQL, TimescaleDB, NATS)
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: timescale/timescaledb-ha:pg16
        env:
          POSTGRES_PASSWORD: ci-superuser-only-in-this-job
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -h 127.0.0.1"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      # A service container cannot take arguments, and NATS needs -js.
      - name: nats with JetStream
        run: |
          docker run -d --name nats -p 4222:4222 -p 8222:8222 nats:2-alpine -js -m 8222
          for _ in $(seq 1 30); do
            curl -fsS 'http://127.0.0.1:8222/healthz?js-enabled-only=true' && exit 0
            sleep 1
          done
          docker logs nats; exit 1
      - name: create the two databases and roles (deploy/postgres/init.sql)
        run: |
          api_pw="$(openssl rand -hex 16)"; deliver_pw="$(openssl rand -hex 16)"
          echo "::add-mask::$api_pw"; echo "::add-mask::$deliver_pw"
          docker exec -i -e PG_CISP_API_PASSWORD="$api_pw" -e PG_CISP_DELIVER_PASSWORD="$deliver_pw" \
            "${{ job.services.postgres.id }}" psql -U postgres -v ON_ERROR_STOP=1 -f - < deploy/postgres/init.sql
          {
            echo "CISP_TEST_DATABASE_URL=postgres://cisp_api:${api_pw}@127.0.0.1:5432/cisp?sslmode=disable"
            echo "CISP_TEST_TIMESERIES_URL=postgres://cisp_deliver:${deliver_pw}@127.0.0.1:5432/cisp_ts?sslmode=disable"
            echo "CISP_TEST_NATS_URL=nats://127.0.0.1:4222"
            echo "CISP_TEST_ADMIN_URL=postgres://postgres:ci-superuser-only-in-this-job@127.0.0.1:5432/postgres?sslmode=disable"
            echo "CISP_TEST_PG_CONTAINER=${{ job.services.postgres.id }}"
          } >> "$GITHUB_ENV"
      - name: make integration (fails when zero tests ran)
        run: make integration
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: integration-log
          path: integration.log

  # The compose-driven end to end tests (WP-6): the webhook latency over
  # 20 publications, the subscriber killed and reconciling, the NATS
  # outage delivered by the scan, and the healthy status line. Each
  # writes its measurements to the step summary.
  e2e:
    name: end to end (compose)
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: make e2e (fails when zero tests ran)
        run: make e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: e2e-log
          path: e2e.log

  # web/ (WP-9): the Next.js app on uspace-ui. Path-filtered to web/**,
  # the OpenAPI and the image's Dockerfile; pnpm's store, Next.js's build
  # cache and the Playwright browser are cached.
  web:
    name: web (lint, types, tests, build, smoke)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    env:
      # Plain output, so the counts copied to the step summary can be read.
      NO_COLOR: "1"
      FORCE_COLOR: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: pnpm install --frozen-lockfile
        run: pnpm install --frozen-lockfile
      - name: generated API types are current (uspace-ui-gen-api)
        run: |
          pnpm gen:api
          out="$(git status --porcelain --untracked-files=all -- src/api)"
          if [ -n "$out" ]; then echo "$out"; git diff -- src/api | head -50
            echo "web/src/api differs from api/openapi.yaml: run 'pnpm gen:api' in web/ and commit"; exit 1; fi
      - name: pnpm lint (the kit's config and the two project rules)
        run: pnpm lint
      - name: pnpm typecheck
        run: pnpm typecheck
      - name: pnpm test (vitest)
        run: |
          pnpm test 2>&1 | tee vitest.log
          { echo '### web: vitest'; echo '```'; grep -E '^ +(Test Files|Tests) ' vitest.log || echo 'counts not found in vitest.log'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: web/.next/cache
          key: next-${{ hashFiles('web/pnpm-lock.yaml') }}-${{ hashFiles('web/app/**', 'web/src/**', 'web/*.ts', 'web/*.mjs') }}
          restore-keys: next-${{ hashFiles('web/pnpm-lock.yaml') }}-
      - name: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: pnpm build
      - name: the server bundle names no database, NATS or key variable
        run: pnpm check:bundle | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Chromium and its system libraries
        run: pnpm exec playwright install --with-deps chromium
      - name: Playwright smoke (next start behind test/mock-api.mjs)
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          pnpm e2e 2>&1 | tee playwright.log
          { echo '### web: Playwright'; echo '```'; grep -E '^ +[0-9]+ (passed|failed|skipped|flaky)' playwright.log || echo 'counts not found in playwright.log'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if ! grep -qE '^ +[1-9][0-9]* passed' playwright.log; then echo "playwright: zero tests passed"; exit 1; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: |
            web/test-results
            web/playwright.log

  # The reference Caddy snippet in front of the built image (WP-13): the
  # chaos stack's caddy profile. The observations go to the step summary.
  caddy:
    name: Caddy profile (built image)
    needs: changes
    if: needs.changes.outputs.caddy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: the Go image, as the image job builds it
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          load: true
          tags: uspace-cisp:chaos-ci
          build-args: VERSION=caddy-${{ github.sha }}
          cache-from: type=gha,scope=go
      - name: make caddy (fails when zero tests ran)
        env:
          CHAOS_IMAGE: uspace-cisp:chaos-ci
        run: make caddy
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: caddy-log
          path: caddy.log

  # The release tooling against fakes: make conformance in each state,
  # and deploy/deploy.sh refusing an unsigned image from a local registry.
  release-tooling:
    name: conformance target and deploy script
    needs: changes
    if: needs.changes.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1
      - name: make conformance-selftest
        run: make conformance-selftest | tee -a "$GITHUB_STEP_SUMMARY"
      - name: make deploy-selftest
        run: |
          cosign version 2>&1 | grep -E '^GitVersion' | tee -a "$GITHUB_STEP_SUMMARY"
          make deploy-selftest | tee -a "$GITHUB_STEP_SUMMARY"

  # The lab's conformance suite (docs/PLAN.md section 10.6), main only:
  # run against the chaos stack when uspace-lab has conformance/cisp/,
  # otherwise a visible "skipped" line in the step summary.
  conformance:
    name: lab conformance
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The uspace-lab commit the suite runs at: a lab change reaches this
      # job only through a reviewed `ci:` commit here, so a run is
      # reproducible and lab code is not run unreviewed (core-ui-ci audit
      # S7). Bump it with the lab's main SHA when the suite changes.
      LAB_REF: 9be1c13e72a94ceda56acd55eff245717385e9bc
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: rootxkit/uspace-lab
          ref: ${{ env.LAB_REF }}
          path: lab
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: make conformance
        run: |
          echo "uspace-lab at $(git -C lab rev-parse --short HEAD) (pinned LAB_REF ${LAB_REF::7})" | tee -a "$GITHUB_STEP_SUMMARY"
          make conformance LAB_DIR=lab
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: conformance-report
          path: conformance-report
          if-no-files-found: ignore

  vectors:
    name: knowledge vectors
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: core's vector tests from this module, then this module's adapters
        run: |
          make vectors 2>&1 | tee vectors.log
          passed="$(grep -c '^--- PASS' vectors.log || true)"
          skipped="$(grep -c '^--- SKIP' vectors.log || true)"
          echo "vectors: ${passed} top-level tests passed, ${skipped} skipped" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$passed" -eq 0 ]; then echo "vectors: zero tests ran"; exit 1; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: vectors-log
          path: vectors.log

  govulncheck:
    name: govulncheck
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      # Pinned like GOVULNCHECK_VERSION in the Makefile.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 -show verbose ./...

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Pinned (and in the Makefile); change both together. The binary,
      # checked against its published SHA-256, not an action holding the
      # GITHUB_TOKEN (core-ui-ci audit N13).
      GITLEAKS_VERSION: "8.24.3"
      GITLEAKS_SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: install gitleaks (pinned, checksum verified)
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$tarball" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: make secrets (history and working tree)
        run: make secrets

  # main and v* tags only, after every gate passed: the images, tagged by
  # short SHA (and by the git tag on a tag). `latest` is never pushed.
  # Each is signed by digest with cosign keyless (the workflow's OIDC
  # identity) and verified with deploy/deploy.sh --verify-only, the check
  # the deploy makes (spec 06 section 4); the sbom and attest jobs then
  # attach a syft SPDX SBOM as a signed attestation. No step between the
  # registry login and the signing is a third party's SBOM tool.
  image:
    name: images
    if: github.event_name == 'push'
    needs: [build-vet-lint, generate-check, test-race, integration, e2e, web, vectors, govulncheck, gitleaks, caddy, release-tooling]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      go_digest: ${{ steps.go.outputs.digest }}
      web_digest: ${{ steps.web.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: tags
        id: tags
        run: |
          short="${GITHUB_SHA::7}"
          go_tags="ghcr.io/rootxkit/uspace-cisp:${short}"
          web_tags="ghcr.io/rootxkit/uspace-cisp-web:${short}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            go_tags+=",ghcr.io/rootxkit/uspace-cisp:${GITHUB_REF_NAME}"
            web_tags+=",ghcr.io/rootxkit/uspace-cisp-web:${GITHUB_REF_NAME}"
            version="$GITHUB_REF_NAME"
          else
            version="$short"
          fi
          { echo "go=$go_tags"; echo "web=$web_tags"; echo "version=$version"; } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Go image (api, deliver, cispctl)
        id: go
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.go }}
          build-args: VERSION=${{ steps.tags.outputs.version }}
          cache-from: type=gha,scope=go
          cache-to: type=gha,mode=max,scope=go
      - name: web image (Next.js standalone, deploy/Dockerfile.web)
        id: web
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: web
          file: deploy/Dockerfile.web
          push: true
          tags: ${{ steps.tags.outputs.web }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1
      - name: sign both digests (cosign keyless)
        env:
          GO_REF: ghcr.io/rootxkit/uspace-cisp@${{ steps.go.outputs.digest }}
          WEB_REF: ghcr.io/rootxkit/uspace-cisp-web@${{ steps.web.outputs.digest }}
        run: |
          cosign sign --yes "$GO_REF"
          cosign sign --yes "$WEB_REF"
      - name: verify as the deploy does (deploy/deploy.sh --verify-only)
        env:
          GO_REF: ghcr.io/rootxkit/uspace-cisp@${{ steps.go.outputs.digest }}
          WEB_REF: ghcr.io/rootxkit/uspace-cisp-web@${{ steps.web.outputs.digest }}
        run: |
          deploy/deploy.sh --verify-only "$GO_REF" "$WEB_REF" 2>&1 | tee verify.log
          {
            echo '### Images'
            echo
            echo "- $GO_REF"
            echo "- $WEB_REF"
            echo
            echo '```'
            cat verify.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: forget the registry credential
        if: always()
        run: docker logout ghcr.io

  # The SBOMs, apart from the push and the signing: the third-party SBOM
  # action runs with a read-only package token and no OIDC token, never
  # beside a registry credential that can push (core-ui-ci audit B1).
  sbom:
    name: SBOMs
    if: github.event_name == 'push'
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - name: read-only registry login
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: SBOM of the Go image (syft, SPDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ghcr.io/rootxkit/uspace-cisp@${{ needs.image.outputs.go_digest }}
          format: spdx-json
          output-file: sbom-uspace-cisp.spdx.json
          upload-artifact: false
      - name: SBOM of the web image (syft, SPDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ghcr.io/rootxkit/uspace-cisp-web@${{ needs.image.outputs.web_digest }}
          format: spdx-json
          output-file: sbom-uspace-cisp-web.spdx.json
          upload-artifact: false
      - name: forget the registry credential
        if: always()
        run: docker logout ghcr.io
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom
          path: sbom-*.spdx.json

  # The SBOMs attached to the digests as signed attestations: cosign
  # alone, with the write and OIDC permissions this needs.
  attest:
    name: attest SBOMs
    if: github.event_name == 'push'
    needs: [image, sbom]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sbom
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1
      - name: attach the SBOMs (cosign keyless)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GO_REF: ghcr.io/rootxkit/uspace-cisp@${{ needs.image.outputs.go_digest }}
          WEB_REF: ghcr.io/rootxkit/uspace-cisp-web@${{ needs.image.outputs.web_digest }}
        run: |
          echo "$TOKEN" | cosign login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          cosign attest --yes --type spdxjson --predicate sbom-uspace-cisp.spdx.json "$GO_REF"
          cosign attest --yes --type spdxjson --predicate sbom-uspace-cisp-web.spdx.json "$WEB_REF"
