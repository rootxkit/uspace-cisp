name: chaos

# The chaos suite (WP-13, test/e2e/chaos_test.go): about 35 minutes,
# because one subscriber stays down for 30. It runs on main, and on a
# pull request only while it carries the `chaos` label (adding the label
# starts it). Its own workflow, so labelling a pull request does not run
# ci.yml again.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  group: chaos-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local

defaults:
  run:
    shell: bash

jobs:
  chaos:
    name: chaos (built image, real faults)
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'chaos')
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: the Go image, as the image job builds it
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: uspace-cisp:chaos-ci
          build-args: VERSION=chaos-${{ github.sha }}
          cache-from: type=gha,scope=go
      - name: make chaos (fails when zero tests ran)
        env:
          CHAOS_IMAGE: uspace-cisp:chaos-ci
        run: make chaos
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: chaos-log
          path: chaos.log
