# NATS for uspace-cisp (deploy/compose.yml): JetStream on a file store
# capped at 2 GB (docs/PLAN.md section 11), monitoring on 8222 inside the
# project network only (the health check reads /healthz).
port: 4222
http_port: 8222

jetstream {
  store_dir: /data
  max_file_store: 2GB
  max_memory_store: 64MB
}
