# uspace-cisp demo deployment (docs/PLAN.md section 11): one compose
# project on its own network. Images are built in CI and pulled by tag;
# `latest` is never deployed. Secrets and addresses come from deploy/.env
# (copy deploy/.env.example; git-ignored).
#
#   CISP_IMAGE_TAG=<short sha or tag> docker compose -f deploy/compose.yml up -d
#
# Caddy is shared and lives in the deployment repository (uspace-deploy),
# which attaches api and web to its edge network and composes
# deploy/caddy/Caddyfile.snippet into the real Caddyfile.
#
# `cispctl migrate all` applies both migration trees; api and deliver
# wait for it to succeed, so the stack refuses to run unmigrated rather
# than pretending. (The command was `cispctl migrate`, a usage error since
# WP-1, so this file could not have started; the chaos suite runs it.)
name: uspace-cisp

x-go-image: &go-image
  image: ghcr.io/rootxkit/uspace-cisp:${CISP_IMAGE_TAG:?set CISP_IMAGE_TAG to a short SHA or tag}
  env_file: .env
  restart: unless-stopped
  networks: [cisp]
  read_only: true
  security_opt: ["no-new-privileges:true"]

services:
  postgres:
    # One container, two databases (cisp, cisp_ts): the droplet layout
    # every system adopted (M37).
    image: timescale/timescaledb-ha:pg16
    restart: unless-stopped
    networks: [cisp]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in deploy/.env}
      PG_CISP_API_PASSWORD: ${PG_CISP_API_PASSWORD:?set in deploy/.env}
      PG_CISP_DELIVER_PASSWORD: ${PG_CISP_DELIVER_PASSWORD:?set in deploy/.env}
    command: ["postgres", "-c", "shared_buffers=128MB"]
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/10-cisp.sql:ro
      - pgdata:/home/postgres/pgdata
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 512M}

  nats:
    image: nats:2-alpine
    restart: unless-stopped
    networks: [cisp]
    command: ["-c", "/etc/nats/nats.conf"]
    volumes:
      - ./nats/nats.conf:/etc/nats/nats.conf:ro
      - natsdata:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8222/healthz?js-enabled-only=true"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 128M}

  migrate:
    <<: *go-image
    restart: "no"
    command: ["cispctl", "migrate", "all"]
    depends_on:
      postgres: {condition: service_healthy}
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 64M}

  api:
    <<: *go-image
    command: ["api"]
    environment:
      # The Go runtime's soft limit under the container's 256M: the GC
      # works harder near it instead of growing past the limit. With the
      # 8 MiB publication cap a PUT peaks near 170 MB of heap
      # (docs/PLAN.md section 15 Q46).
      GOMEMLIMIT: 200MiB
    depends_on:
      migrate: {condition: service_completed_successfully}
      nats: {condition: service_started}
    healthcheck:
      test: ["CMD", "api", "-probe=/readyz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 256M}

  deliver:
    <<: *go-image
    command: ["deliver"]
    environment:
      GOMEMLIMIT: 48MiB
    depends_on:
      migrate: {condition: service_completed_successfully}
      nats: {condition: service_started}
    healthcheck:
      test: ["CMD", "deliver", "-probe=/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 64M}

  web:
    # The Next.js public map and console (WP-9): `--profile web`. It
    # renders and runs the three BFF routes; it holds no database URL, no
    # NATS URL and no signing key, so it takes no env_file. Its one secret
    # is the MFA challenge seal, from deploy/.env. Caddy routes /_bff/*
    # and every page here, /public/*, /v1/* and /basemap/* elsewhere.
    profiles: [web]
    image: ghcr.io/rootxkit/uspace-cisp-web:${CISP_IMAGE_TAG:?set CISP_IMAGE_TAG to a short SHA or tag}
    restart: unless-stopped
    networks: [cisp]
    read_only: true
    tmpfs: [/tmp, /app/.next/cache]
    security_opt: ["no-new-privileges:true"]
    environment:
      # The API as the BFF reaches it inside the network.
      CISP_API_INTERNAL_URL: ${WEB_API_INTERNAL_URL:-http://api:8080}
      # Where the browser reaches the API; empty is same-origin (Caddy).
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
      # One Caddy in front of Next.js appends to X-Forwarded-For.
      CISP_WEB_TRUSTED_PROXY_HOPS: ${WEB_TRUSTED_PROXY_HOPS:-1}
      CISP_WEB_SESSION_MAX_AGE_S: ${WEB_SESSION_MAX_AGE_S:-43200}
      CISP_WEB_UPSTREAM_TIMEOUT_MS: ${WEB_UPSTREAM_TIMEOUT_MS:-10000}
      # Seals the MFA challenge cookie between the two sign-in steps; at
      # least 32 bytes. Empty, the BFF answers 503 naming it.
      CISP_WEB_MFA_CHALLENGE_SECRET: ${WEB_MFA_CHALLENGE_SECRET:-}
      # Branding JSON inside the container (mount it read-only); empty
      # uses the code-name defaults.
      CISP_BRANDING_FILE: ${WEB_BRANDING_FILE:-}
      # The public map's first view, "lng,lat" and a zoom (WP-10). No
      # default: unset, the page says so instead of choosing a place.
      NEXT_PUBLIC_MAP_CENTER: ${WEB_MAP_CENTER:-}
      NEXT_PUBLIC_MAP_ZOOM: ${WEB_MAP_ZOOM:-}
      # HEAD poll period while the stream is not live, seconds.
      CISP_WEB_POLL_INTERVAL_S: ${WEB_POLL_INTERVAL_S:-60}
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 256M}

networks:
  cisp:
    name: uspace-cisp

volumes:
  pgdata:
  natsdata:
