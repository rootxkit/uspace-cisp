name: chaos

# The chaos suite (WP-13, test/e2e/chaos_test.go): about 35 minutes,
# because one subscriber stays down for 30. It runs on main, and on a
# pull request only while it carries the `chaos` label (adding the label
# starts it). Its own workflow, so labelling a pull request does not run
# ci.yml again.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  group: chaos-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local

defaults:
  run:
    shell: bash

jobs:
  chaos:
    name: chaos (built image, real faults)
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'chaos')
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: the Go image, as the image job builds it
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          load: true
          tags: uspace-cisp:chaos-ci
          build-args: VERSION=chaos-${{ github.sha }}
          cache-from: type=gha,scope=go
      - name: make chaos (fails when zero tests ran)
        env:
          CHAOS_IMAGE: uspace-cisp:chaos-ci
        run: make chaos
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: chaos-log
          path: chaos.log
