# sqlc: typed queries for the two databases, generated into
# internal/store/relational and internal/store/timeseries and committed;
# `make generate-check` proves they are current. The schemas are the
# goose trees (sqlc reads the Up sections). Relational queries live in
# internal/store/queries/*.sql, one file per owner (WP-1's publications.sql,
# later restrictions.sql, subscriptions.sql, console.sql); timeseries
# queries in internal/store/queries/timeseries/.
version: "2"
sql:
  - engine: postgresql
    schema: migrations/relational
    queries: internal/store/queries
    gen:
      go:
        package: relational
        out: internal/store/relational
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
  - engine: postgresql
    schema: migrations/timeseries
    queries: internal/store/queries/timeseries
    gen:
      go:
        package: timeseries
        out: internal/store/timeseries
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
overrides:
  go:
    overrides:
      - db_type: timestamptz
        go_type: time.Time
      - db_type: timestamptz
        nullable: true
        go_type:
          import: time
          type: Time
          pointer: true
